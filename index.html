:root {
  --magenta: #9b2263;
  --magenta-dark: #7d1a4f;
  --brown: #4a2b24;
  --ink: #2b2f36;
  --muted: #6b7280;
  --line: #e5e1e4;
  --bg: #f6f4f5;
  --panel: #ffffff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Card Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

.top {
  background: linear-gradient(90deg, var(--brown), var(--magenta) 60%, #c43d8c);
  color: #fff;
  padding: 14px 24px;
}
.brand { display: flex; align-items: baseline; gap: 14px; max-width: 1280px; margin: 0 auto; }
.brand-mark { font-weight: 600; letter-spacing: 0.32em; font-size: 20px; }
.brand-sub { opacity: 0.85; font-size: 14px; letter-spacing: 0.04em; }

.layout {
  max-width: 1280px;
  margin: 24px auto;
  padding: 0 16px;
  display: grid;
  grid-template-columns: 360px 1fr;
  gap: 24px;
  align-items: start;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 20px;
}
.panel h1 { margin: 0 0 4px; font-size: 18px; }
.lead { margin: 0 0 16px; color: var(--muted); font-size: 13px; }

label { display: block; margin-bottom: 14px; }
label > span { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
label em { font-style: normal; font-weight: 400; color: var(--muted); }
label small { display: block; margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 1.4; }

input, textarea {
  width: 100%;
  font: inherit;
  font-size: 15px;
  padding: 9px 11px;
  border: 1px solid #d6d1d4;
  border-radius: 8px;
  background: #fff;
  color: var(--ink);
  resize: vertical;
}
input:focus, textarea:focus {
  outline: none;
  border-color: var(--magenta);
  box-shadow: 0 0 0 3px rgba(155, 34, 99, 0.15);
}

.more { margin: 4px 0 16px; }
.more summary { cursor: pointer; font-size: 13px; color: var(--magenta); margin-bottom: 10px; }

.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  padding: 10px 14px;
  border-radius: 8px;
  border: 1px solid #d6d1d4;
  background: #fff;
  color: var(--ink);
  cursor: pointer;
}
.btn:hover { border-color: var(--magenta); }
.btn.primary { background: var(--magenta); border-color: var(--magenta); color: #fff; flex: 1 1 100%; padding: 12px; }
.btn.primary:hover { background: var(--magenta-dark); }
.btn.ghost { border-color: transparent; color: var(--muted); }

.preview { position: sticky; top: 16px; }
.canvas-wrap {
  background: #fff;
  border-radius: 10px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 12px 32px rgba(74, 43, 36, 0.12);
  overflow: hidden;
  line-height: 0;
  opacity: 0;
  transition: opacity 0.25s;
}
.ready .canvas-wrap { opacity: 1; }
canvas { width: 100%; height: auto; display: block; }
.note { color: var(--muted); font-size: 12px; margin: 10px 2px 0; }

@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .preview { position: static; order: -1; }
}

</style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="brand-mark">DECOR</span>
      <span class="brand-sub">Visiting Card Maker</span>
    </div>
  </header>

  <main class="layout">
    <form id="cardForm" class="panel" autocomplete="off">
      <h1>Card details</h1>
      <p class="lead">Fill in the details. The preview updates as you type.</p>

      <label>
        <span>Name</span>
        <input name="name" type="text" placeholder="Md. Mahinur Rashid" />
        <small>Always printed in capital letters.</small>
      </label>

      <label>
        <span>Education</span>
        <input name="education" type="text" placeholder="B.Sc (EEE)" />
        <small>Leave empty to hide this line.</small>
      </label>

      <label>
        <span>Designation <em>(one line each, max 3)</em></span>
        <textarea name="designation" rows="3" placeholder="Assistant Manager&#10;engineering &amp; business development"></textarea>
        <small>Capital letters print large, small letters print as small capitals —
          e.g. <b>Assistant Manager</b> gives the big “A” like the original card.</small>
      </label>

      <label>
        <span>Phone</span>
        <input name="phone" type="text" inputmode="tel" placeholder="01708-801850" />
      </label>

      <label>
        <span>Email</span>
        <input name="email" type="text" inputmode="email" placeholder="name.decor@gmail.com" />
      </label>

      <details class="more">
        <summary>More options</summary>
        <label>
          <span>Company email (under designation)</span>
          <input name="companyEmail" type="text" placeholder="info@decor-bd.com" />
          <small>Leave empty to hide it.</small>
        </label>
      </details>

      <div class="actions">
        <button type="button" id="downloadBtn" class="btn primary">Download PNG</button>
        <button type="button" id="sampleBtn" class="btn">Load sample</button>
        <button type="button" id="clearBtn" class="btn ghost">Clear</button>
      </div>
    </form>

    <section class="preview">
      <div class="canvas-wrap">
        <canvas id="card" width="1600" height="914" aria-label="Card preview"></canvas>
      </div>
      <p class="note">Output: 1600 × 914 px PNG — same size as the original card artwork.</p>
    </section>
  </main>

  <script>
/* ------------------------------------------------------------------
   DECOR visiting card renderer
   Draws the front (details) side of the card onto a 1600 x 914 canvas.
   All positions are in pixels of the original card design.
   Adjust LAYOUT below if you ever want to nudge sizes or spacing.
------------------------------------------------------------------- */

const CARD_W = 1600;
const CARD_H = 914;

const COLORS = {
  text: "#3E4955",   // dark slate used for name, degree, designation, phone
  email: "#666666",  // grey serif used for e-mail lines
};

const FONTS = {
  sans: '"Card Inter"',
  phone: '"Card Poppins"',
  serif: '"Card Pagella"',
};

const LAYOUT = {
  left: 793,          // x where the name / degree / designation start
  maxRight: 1455,     // text never goes past this x (keeps clear of the dots)

  name:        { y: 231, size: 36, weight: 600, tracking: 1.3 },
  education:   { y: 279, size: 30, weight: 400, tracking: 2.4, smallCaps: 0.78 },
  designation: { y: 333, size: 30, weight: 600, tracking: 3.0, smallCaps: 0.82, lineGap: 47 },
  companyMail: { gapAfterDesignation: 51, size: 34 },
  noEducationShift: 46, // move designation up by this much when degree is blank

  phone: { x: 886, y: 629, size: 33, tracking: 2.0, maxRight: 1560 },
  email: { x: 898, y: 696, size: 39, maxRight: 1560 },
};

/* ---------- helpers ---------- */

function setFont(ctx, weight, size, family) {
  ctx.font = `${weight} ${size}px ${family}`;
}

/** Measure / draw text letter by letter so tracking works in every browser. */
function trackedWidth(ctx, text, tracking) {
  let w = 0;
  for (const ch of text) w += ctx.measureText(ch).width + tracking;
  return w - (text.length ? tracking : 0);
}

function drawTracked(ctx, text, x, y, tracking) {
  for (const ch of text) {
    ctx.fillText(ch, x, y);
    x += ctx.measureText(ch).width + tracking;
  }
  return x;
}

/**
 * Small-caps: capital letters / digits / symbols stay full size,
 * lowercase letters are drawn as smaller capitals.
 * Returns the width; draws only when draw === true.
 */
function smallCaps(ctx, text, x, y, opt, scale, draw) {
  const big = opt.size * scale;
  const small = big * opt.smallCaps;
  const tr = opt.tracking * scale;
  let cx = x;
  for (const ch of text) {
    const isLower = ch !== ch.toUpperCase();
    setFont(ctx, opt.weight, isLower ? small : big, FONTS.sans);
    const glyph = ch.toUpperCase();
    if (draw) ctx.fillText(glyph, cx, y);
    cx += ctx.measureText(glyph).width + tr;
  }
  return cx - x - (text.length ? tr : 0);
}

/** Shrink factor (<= 1) so a line fits into maxWidth. */
function fitScale(width, maxWidth) {
  return width > maxWidth ? maxWidth / width : 1;
}

/* ---------- main renderer ---------- */

/**
 * @param {HTMLCanvasElement} canvas
 * @param {HTMLImageElement} template  blank card background (embedded below as TEMPLATE_SRC)
 * @param {{name:string, education:string, designation:string, phone:string,
 *          email:string, companyEmail:string}} d
 */
function drawCard(canvas, template, d) {
  canvas.width = CARD_W;
  canvas.height = CARD_H;
  const ctx = canvas.getContext("2d");
  ctx.textBaseline = "alphabetic";
  ctx.clearRect(0, 0, CARD_W, CARD_H);
  ctx.drawImage(template, 0, 0, CARD_W, CARD_H);

  const L = LAYOUT;
  const maxW = L.maxRight - L.left;

  /* Name — always UPPERCASE, bold */
  const name = (d.name || "").trim().toUpperCase();
  if (name) {
    const o = L.name;
    setFont(ctx, o.weight, o.size, FONTS.sans);
    const s = fitScale(trackedWidth(ctx, name, o.tracking), maxW);
    setFont(ctx, o.weight, o.size * s, FONTS.sans);
    ctx.fillStyle = COLORS.text;
    drawTracked(ctx, name, L.left, o.y, o.tracking * s);
  }

  /* Education — small caps, regular */
  const edu = (d.education || "").trim();
  let shift = 0;
  if (edu) {
    const o = L.education;
    const s = fitScale(smallCaps(ctx, edu, 0, 0, o, 1, false), maxW);
    ctx.fillStyle = COLORS.text;
    smallCaps(ctx, edu, L.left, o.y, o, s, true);
  } else {
    shift = L.noEducationShift;
  }

  /* Designation — one entry per line, small caps, semibold */
  const lines = (d.designation || "")
    .split(/\r?\n/)
    .map((t) => t.trim())
    .filter(Boolean)
    .slice(0, 3);
  const o = L.designation;
  let y = o.y - shift;
  lines.forEach((line, i) => {
    y = o.y - shift + i * o.lineGap;
    const s = fitScale(smallCaps(ctx, line, 0, 0, o, 1, false), maxW);
    ctx.fillStyle = COLORS.text;
    smallCaps(ctx, line, L.left, y, o, s, true);
  });
  const lastLineY = lines.length ? y : o.y - shift - o.lineGap;

  /* Company e-mail (info@decor-bd.com) under the designation */
  const cmail = (d.companyEmail || "").trim();
  if (cmail) {
    const c = L.companyMail;
    setFont(ctx, 400, c.size, FONTS.serif);
    const s = fitScale(ctx.measureText(cmail).width, maxW);
    setFont(ctx, 400, c.size * s, FONTS.serif);
    ctx.fillStyle = COLORS.email;
    ctx.fillText(cmail, L.left + 2, lastLineY + c.gapAfterDesignation);
  }

  /* Phone (next to the phone icon) */
  const phone = (d.phone || "").trim();
  if (phone) {
    const p = L.phone;
    setFont(ctx, 400, p.size, FONTS.phone);
    const s = fitScale(trackedWidth(ctx, phone, p.tracking), p.maxRight - p.x);
    setFont(ctx, 400, p.size * s, FONTS.phone);
    ctx.fillStyle = COLORS.text;
    drawTracked(ctx, phone, p.x, p.y, p.tracking * s);
  }

  /* Personal e-mail (next to the envelope icon) */
  const email = (d.email || "").trim();
  if (email) {
    const e = L.email;
    setFont(ctx, 400, e.size, FONTS.serif);
    const s = fitScale(ctx.measureText(email).width, e.maxRight - e.x);
    setFont(ctx, 400, e.size * s, FONTS.serif);
    ctx.fillStyle = COLORS.email;
    ctx.fillText(email, e.x, e.y);
  }
}

/** Make sure the web fonts are ready before drawing on the canvas. */
async function loadCardFonts() {
  await Promise.all([
    document.fonts.load(`400 40px ${FONTS.sans}`),
    document.fonts.load(`600 40px ${FONTS.sans}`),
    document.fonts.load(`400 40px ${FONTS.phone}`),
    document.fonts.load(`400 40px ${FONTS.serif}`),
  ]);
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

</script>

(function () {
  const form = document.getElementById("cardForm");
  const canvas = document.getElementById("card");
  const FIELDS = ["name", "education", "designation", "phone", "email", "companyEmail"];
  const STORAGE_KEY = "decor-card-maker";

  const SAMPLE = {
    name: "Md. Mahinur Rashid",
    education: "B.Sc (EEE)",
    designation: "Assistant Manager\nengineering & business development",
    phone: "01708-801850",
    email: "mahinr.decor@gmail.com",
    companyEmail: "info@decor-bd.com",
  };

  let template = null;

  function readForm() {
    const d = {};
    FIELDS.forEach((f) => (d[f] = form.elements[f].value));
    return d;
  }

  function fillForm(d) {
    FIELDS.forEach((f) => (form.elements[f].value = d[f] ?? ""));
  }

  function save(d) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch (e) {}
  }

  function restore() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  /* Allow pre-filled links, e.g. ?name=...&phone=... */
  function fromQuery() {
    const q = new URLSearchParams(location.search);
    if (![...q.keys()].length) return null;
    const d = { ...SAMPLE };
    FIELDS.forEach((f) => { if (q.has(f)) d[f] = q.get(f).replace(/\\n|\|/g, "\n"); });
    return d;
  }

  let pending = false;
  function render() {
    if (!template || pending) return;
    pending = true;
    requestAnimationFrame(() => {
      pending = false;
      const d = readForm();
      drawCard(canvas, template, d);
      save(d);
    });
  }

  function fileName() {
    const n = form.elements.name.value.trim() || "card";
    return "DECOR-card-" + n.replace(/[^\w]+/g, "-").replace(/^-|-$/g, "") + ".png";
  }

  function download() {
    canvas.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName();
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }, "image/png");
  }

  form.addEventListener("input", render);
  document.getElementById("downloadBtn").addEventListener("click", download);
  document.getElementById("sampleBtn").addEventListener("click", () => { fillForm(SAMPLE); render(); });
  document.getElementById("clearBtn").addEventListener("click", () => {
    fillForm({ companyEmail: SAMPLE.companyEmail });
    render();
  });

  fillForm(fromQuery() || restore() || SAMPLE);

  Promise.all([loadImage(TEMPLATE_SRC), loadCardFonts()])
    .then(([img]) => {
      template = img;
      render();
      document.body.classList.add("ready");
    })
    .catch((err) => {
      console.error(err);
      alert("Could not load the card template. Please refresh the page.");
    });
})();

</script>
